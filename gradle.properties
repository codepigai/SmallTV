# org.gradle.java.home 为本机 JDK 17 路径；换机器时需改为对应的 JDK 17 安装路径。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=D\:/app/bigtext/tools/jdk17
android.useAndroidX=true
# 本机使用 fake-IP 系统代理（127.0.0.1:7893），Gradle JVM 不走系统代理，需显式指定，否则解析新依赖直连超时。换机器或不用代理时删除以下 4 行。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7893
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7893
android.nonTransitiveRClass=true
kotlin.code.style=official
